name: Sensitive diagnostic tests

on:
  pull_request:
    paths:
      - rustfs-kms-test.sh
      - rustfs-upgrade-test.sh
      - rustfs-security-test.sh
      - test_sensitive_diagnostics.py
      - .github/workflows/sensitive-diagnostics-tests.yml
  push:
    branches: [main]
    paths:
      - rustfs-kms-test.sh
      - rustfs-upgrade-test.sh
      - rustfs-security-test.sh
      - test_sensitive_diagnostics.py
      - .github/workflows/sensitive-diagnostics-tests.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - run: bash -n rustfs-kms-test.sh && bash -n rustfs-upgrade-test.sh && bash -n rustfs-security-test.sh
      - run: python3 -B test_sensitive_diagnostics.py
