name: RustFS Validation Cases

# Catalog lane for the functional chain. Nightly selects this suite the same
# way it selects s3/heal/pool. Each chain runs one rotating window of the
# sweepable catalog against the dispatched candidate. Interactive heal cases
# stay on the functional chain's workflow_dispatch validation job because they
# download validation-tools artifacts that are still built on rustfs/rustfs.
# validation-package and validation-tools builds are not moved here.

on:
  workflow_call:
    inputs:
      chain_manifest:
        description: Verified candidate and chain attempt from the chain driver
        type: string
        required: true
      rotate:
        description: Take the UTC day-of-year window instead of the full catalog
        type: boolean
        required: false
        default: false
      limit:
        description: Cases in the rotating window, or the manual cap when rotate is false (0 = everything)
        type: number
        required: false
        default: 0
      case:
        description: Single canonical case id; overrides rotation
        type: string
        required: false
        default: ''
      module:
        description: Restrict selection to one catalog module
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      case:
        description: 'Single canonical validation case id, e.g. pool.decommission'
        type: string
        required: false
        default: ''
      module:
        description: 'Restrict the run to one catalog module'
        type: string
        required: false
        default: ''
      limit:
        description: 'Maximum cases (0 = everything selected). Ignored for a single case.'
        type: number
        required: false
        default: 0
      rotate:
        description: 'Use the nightly UTC rotation window'
        type: boolean
        required: false
        default: false
      build_run_id:
        description: 'Successful nightly package run; empty resolves the latest'
        type: string
        required: false
        default: ''
      build_run_attempt:
        description: 'Attempt of that package run'
        type: string
        required: false
        default: '1'

permissions:
  contents: read

concurrency:
  group: rustfs-shared-functional-tests-v2
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  RUSTFS_NODES: ${{ secrets.RUSTFS_NODES || vars.RUSTFS_NODES || 'vm000 vm001 vm002 vm003' }}
  RUSTFS_SSH_USER: ${{ secrets.RUSTFS_SSH_USER || vars.RUSTFS_SSH_USER || 'azureuser' }}
  RUSTFS_ACCESS_KEY: ${{ secrets.RUSTFS_ACCESS_KEY }}
  RUSTFS_SECRET_KEY: ${{ secrets.RUSTFS_SECRET_KEY }}
  RUSTFS_API_ENDPOINT: ${{ secrets.RUSTFS_API_ENDPOINT || vars.RUSTFS_API_ENDPOINT || vars.RUSTFS_RC_ENDPOINT || 'http://rustfs-node1:9000' }}
  PF_TESTING_GH_TOKEN: ${{ secrets.PF_TESTING_GH_TOKEN }}

jobs:
  validation-cases:
    runs-on: smoke-testing
    timeout-minutes: 330
    if: ${{ inputs.chain_manifest != '' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout chain tooling
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
        with:
          persist-credentials: false

      - name: Initialize validation case evidence
        id: evidence
        run: |
          set -euo pipefail
          umask 077
          CASES_ROOT="${RUNNER_TEMP}/rustfs-validation-cases-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -- "${CASES_ROOT}" "${CASES_ROOT}/results" "${CASES_ROOT}-scratch"
          {
            printf 'CASES_ROOT=%s\n' "${CASES_ROOT}"
            printf 'TMPDIR=%s-scratch\n' "${CASES_ROOT}"
          } >> "${GITHUB_ENV}"

      - name: Bind functional candidate
        id: chain
        # github.event_name is inherited from the caller in reusable
        # workflows, so it is never 'workflow_call'; gate on the manifest
        # the chain passes instead (the repository_dispatch nightly chain
        # skipped binding and every case died with 'candidate manifest
        # missing' — run 41678727913).
        if: ${{ inputs.chain_manifest != '' }}
        env:
          CHAIN_MANIFEST: ${{ inputs.chain_manifest }}
        run: |
          set -euo pipefail
          python3 scripts/functional_chain_evidence.py consume
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          chain = json.loads(os.environ["CHAIN_MANIFEST"])
          manifest = chain["candidate"]["manifest"]
          root = Path(os.environ["CASES_ROOT"])
          (root / "candidate.json").write_text(json.dumps({
              "package_url": manifest["package_url"],
              "package_sha256": manifest["package_sha256"],
              "source_sha": manifest["source_sha"],
          }, sort_keys=True) + "\n")
          PY

      - name: Resolve nightly candidate
        id: resolved
        # Same reusable-workflow gotcha as the Bind step above: the
        # caller's workflow_dispatch leaks through workflow_call, so chain
        # runs must skip this standalone resolver - with the chain env
        # half-set it dies in manual_manifest (run 41948811406).
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.chain_manifest == '' }}
        env:
          GH_TOKEN: ${{ secrets.PF_TESTING_GH_TOKEN }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          BUILD_RUN_ATTEMPT: ${{ inputs.build_run_attempt }}
          CHAIN_OUTPUT: ${{ runner.temp }}/validation-cases-resolved.json
        run: |
          set -euo pipefail
          if [ -z "${BUILD_RUN_ID:-}" ]; then
            LATEST="$(gh api "repos/rustfs/rustfs/actions/workflows/nightly-gnu.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0]')"
            BUILD_RUN_ID="$(printf '%s' "${LATEST}" | jq -r '.id')"
            BUILD_RUN_ATTEMPT="$(printf '%s' "${LATEST}" | jq -r '.run_attempt')"
            export BUILD_RUN_ID BUILD_RUN_ATTEMPT
            echo "manual validation cases pinned to nightly ${BUILD_RUN_ID} attempt ${BUILD_RUN_ATTEMPT}"
          fi
          python3 scripts/resolve_functional_candidate.py
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["CASES_ROOT"])
          chain = json.loads(Path(os.environ["CHAIN_OUTPUT"]).read_text())
          manifest = chain["candidate"]["manifest"]
          (root / "candidate.json").write_text(json.dumps({
              "package_url": manifest["package_url"],
              "package_sha256": manifest["package_sha256"],
              "source_sha": manifest["source_sha"],
          }, sort_keys=True) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("testing_sha=" + chain["testing_sha"] + "\n")
          PY

      - name: Prepare validation Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install validation Python requirements
        run: |
          set -euo pipefail
          validation_python="${RUNNER_TEMP}/rustfs-validation-python-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "${validation_python}"
          python3 -m venv "${validation_python}"
          "${validation_python}/bin/python" -m pip install \
            -r scripts/validation_ilm/requirements.txt
          printf '%s\n' "${validation_python}/bin" >> "${GITHUB_PATH}"

      - name: Select validation cases
        id: select
        env:
          SELECTED_CASE: ${{ inputs.case }}
          SELECTED_MODULE: ${{ inputs.module }}
          CASE_LIMIT: ${{ inputs.limit }}
          VALIDATION_ROTATE: ${{ inputs.rotate }}
        run: |
          set -euo pipefail
          python3 scripts/select_validation_cases.py --output "${CASES_ROOT}/sweep-cases.txt"

      - name: Admit clean shared environment
        id: environment
        timeout-minutes: 5
        env:
          FUNCTIONAL_ENVIRONMENT_RECEIPT: ${{ runner.temp }}/environment-validation-cases.json
        run: python3 scripts/functional_environment.py enter --suite validation-cases

      - name: Run validation cases
        id: test
        timeout-minutes: 300
        continue-on-error: true
        env:
          AUTO_TESTING_SHA: ${{ steps.chain.outputs.testing_sha || steps.resolved.outputs.testing_sha }}
        run: |
          set -uo pipefail
          failed=0
          : > "${CASES_ROOT}/results.txt"
          while read -r CASE_ID; do
            [ -n "${CASE_ID}" ] || continue
            echo "::group::case ${CASE_ID}"
            rm -rf "${CASES_ROOT}/run"
            if ./scripts/run_validation_case.sh \
                 "${CASE_ID}" "${CASES_ROOT}/candidate.json" \
                 "${AUTO_TESTING_SHA}" "${CASES_ROOT}/run" \
                 < /dev/null \
                 > "${CASES_ROOT}/results/${CASE_ID//\//_}.log" 2>&1; then
              printf '%s\tPASS\n' "${CASE_ID}" >> "${CASES_ROOT}/results.txt"
              echo "case ${CASE_ID}: PASS"
            else
              printf '%s\tFAIL\n' "${CASE_ID}" >> "${CASES_ROOT}/results.txt"
              echo "case ${CASE_ID}: FAIL"
              failed=1
            fi
            if [ -f "${CASES_ROOT}/run/report.md" ]; then
              cp "${CASES_ROOT}/run/report.md" "${CASES_ROOT}/results/${CASE_ID//\//_}.report.md" 2>/dev/null || true
            fi
            echo "::endgroup::"
            for node in ${RUSTFS_NODES}; do
              ssh -n -o BatchMode=yes -o ConnectTimeout=10 "${RUSTFS_SSH_USER}@${node}" '
                SUDO=""; [ "$(id -u)" -ne 0 ] && SUDO="sudo -n"
                ${SUDO} systemctl stop rustfs 2>/dev/null || true
                if ${SUDO} dpkg -l rustfs 2>/dev/null | grep -q "^ii"; then
                  ${SUDO} dpkg -P rustfs
                fi
                for i in 1 2 3 4; do ${SUDO} rm -rf /data/rustfs${i}/mnmd; done
                ${SUDO} rm -f /etc/default/rustfs
              ' || echo "inter-case cleanup failed on ${node} (continuing)"
            done
          done < "${CASES_ROOT}/sweep-cases.txt"
          echo "validation cases finished: $(wc -l < "${CASES_ROOT}/results.txt") case(s) executed"
          exit "${failed}"

      - name: Generate validation case report
        id: chain_report
        if: ${{ always() && steps.evidence.outcome == 'success' }}
        env:
          AUTO_TESTING_SHA: ${{ steps.chain.outputs.testing_sha || steps.resolved.outputs.testing_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["CASES_ROOT"])
          catalog = json.loads(Path("validation-cases.json").read_text())
          module_of = {case["id"]: module["id"] for module in catalog["modules"] for case in module["cases"]}
          rows = []
          for line in (root / "results.txt").read_text().splitlines():
              if not line:
                  continue
              case_id, status = line.split("\t")
              rows.append((case_id, module_of.get(case_id, "?"), status))
          if not rows:
              raise SystemExit("validation cases produced no results")
          lines = ["| Case | Status |", "| --- | --- |"]
          lines += [f"| {case_id} | {status} |" for case_id, _, status in rows]
          (root / "cases.md").write_text("\n".join(lines) + "\n")
          passed = sum(1 for _, _, status in rows if status == "PASS")
          failed = len(rows) - passed
          run_url = (f"{os.environ.get('GITHUB_SERVER_URL', 'https://github.com')}/"
                     f"{os.environ.get('GITHUB_REPOSITORY', 'rustfs/auto-testing')}/actions/runs/"
                     f"{os.environ.get('GITHUB_RUN_ID', '')}")
          report = [
              "# RustFS validation cases report", "",
              f"- Run: {run_url}",
              f"- Attempt: {os.environ.get('GITHUB_RUN_ATTEMPT', '')}",
              f"- Trigger: {os.environ.get('GITHUB_EVENT_NAME', '')}",
              f"- auto-testing: {os.environ.get('AUTO_TESTING_SHA', '')}", "",
              "Catalog cases selected for this functional-chain lane.", "",
              "## Case Summary", "",
          ]
          report += lines
          report += ["", f"- Total: {len(rows)}", f"- PASS: {passed}", f"- FAIL: {failed}", ""]
          (root / "report.md").write_text("\n".join(report) + "\n")
          PY
          cat "${CASES_ROOT}/report.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload functional report to dashboard
        if: ${{ always() && steps.environment.outcome == 'success' && steps.chain_report.outcome == 'success' }}
        timeout-minutes: 2
        continue-on-error: true
        env:
          GH_TOKEN: ${{ env.PF_TESTING_GH_TOKEN }}
          REPORT_FILE: ${{ env.CASES_ROOT }}/report.md
          SUITE: validation
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "PF_TESTING_GH_TOKEN is not configured; skipping dashboard upload"
            exit 0
          fi
          DATE="$(date -u +%Y-%m-%d)"
          REPORT_PATH="functional-reports/${SUITE}/${DATE}.md"
          B64_FILE="$(mktemp)"
          python3 -c 'import base64,sys;print(base64.b64encode(open(sys.argv[1],"rb").read()).decode())' "${REPORT_FILE}" > "${B64_FILE}"
          SHA="$(gh api "repos/rustfs/dashboard/contents/${REPORT_PATH}" -q '.sha' 2>/dev/null || true)"
          if [ -n "${SHA}" ]; then
            jq -n --arg msg "report(${SUITE}): ${DATE}" --rawfile content "${B64_FILE}" --arg sha "${SHA}" \
              '{message:$msg, content:($content|rtrimstr("\n")), sha:$sha}' \
              | gh api --method PUT "repos/rustfs/dashboard/contents/${REPORT_PATH}" --input - >/dev/null
          else
            jq -n --arg msg "report(${SUITE}): ${DATE}" --rawfile content "${B64_FILE}" \
              '{message:$msg, content:($content|rtrimstr("\n"))}' \
              | gh api --method PUT "repos/rustfs/dashboard/contents/${REPORT_PATH}" --input - >/dev/null
          fi
          echo "dashboard updated: ${REPORT_PATH}"

      - name: Retain validation case logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustfs-validation-cases-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.CASES_ROOT }}/report.md
            ${{ env.CASES_ROOT }}/cases.md
            ${{ env.CASES_ROOT }}/results.txt
            ${{ env.CASES_ROOT }}/sweep-cases.txt
            ${{ env.CASES_ROOT }}/candidate.json
            ${{ env.CASES_ROOT }}/results/
          if-no-files-found: warn
          retention-days: 30

      - name: Cleanup environment (after)
        id: environment_cleanup
        timeout-minutes: 5
        if: ${{ always() && steps.environment.outcome == 'success' }}
        run: |
          set -uo pipefail
          cleanup_status=0
          for node in ${RUSTFS_NODES}; do
            ssh -o BatchMode=yes -o ConnectTimeout=10 "${RUSTFS_SSH_USER}@${node}" '
              set -euo pipefail
              SUDO=""; [ "$(id -u)" -ne 0 ] && SUDO="sudo -n"
              ${SUDO} systemctl stop rustfs 2>/dev/null || true
              if ${SUDO} dpkg -l rustfs 2>/dev/null | grep -q "^ii"; then
                ${SUDO} dpkg -P rustfs
              fi
              for i in 1 2 3 4; do ${SUDO} rm -rf /data/rustfs${i}/mnmd; done
              ${SUDO} rm -f /etc/default/rustfs
            ' || cleanup_status=$?
          done
          exit "${cleanup_status}"

      - name: Release environment only after successful cleanup
        if: ${{ always() && steps.environment.outcome == 'success' }}
        timeout-minutes: 5
        env:
          FUNCTIONAL_ENVIRONMENT_RECEIPT: ${{ runner.temp }}/environment-validation-cases.json
          CLEANUP_OUTCOME: ${{ steps.environment_cleanup.outcome }}
        run: python3 scripts/functional_environment.py finish --suite validation-cases --cleanup-outcome "$CLEANUP_OUTCOME"

      - name: Retain environment ownership and cleanup receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: functional-environment-validation-cases-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/environment-validation-cases.json
          if-no-files-found: error

      - name: Record chain evidence
        id: chain_record
        if: ${{ always() && inputs.chain_manifest != '' && steps.evidence.outcome == 'success' }}
        env:
          CHAIN_MANIFEST: ${{ inputs.chain_manifest }}
          CHAIN_JOB_STATUS: ${{ job.status }}
          CHAIN_TEST_OUTCOME: ${{ steps.test.outcome }}
          CHAIN_REPORT_OUTCOME: ${{ steps.chain_report.outcome }}
        run: >-
          python3 scripts/functional_chain_evidence.py record --suite validation-cases
          --report "${CASES_ROOT}/cases.md"
          --output "${RUNNER_TEMP}/chain-validation-cases-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/validation-cases.json"

      - name: Upload chain evidence
        if: ${{ always() && steps.chain_record.outputs.written == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: functional-chain-validation-cases-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chain-validation-cases-${{ github.run_id }}-${{ github.run_attempt }}/validation-cases.json
          if-no-files-found: error

      - name: Enforce suite and report result
        if: ${{ always() }}
        env:
          SUITE_OUTCOME: ${{ steps.test.outcome }}
          REPORT_OUTCOME: ${{ steps.chain_report.outcome }}
        run: |
          test "$SUITE_OUTCOME" = success
          test "$REPORT_OUTCOME" = success
          python3 scripts/functional_chain_evidence.py verify-report --suite validation-cases --report "${CASES_ROOT}/cases.md"
