name: KMS Script Tests

on:
  pull_request:
    paths:
      - rustfs-kms-test.sh
      - test_rustfs_kms_presign.py
      - .github/workflows/kms-script-tests.yml
  push:
    branches: [main]
    paths:
      - rustfs-kms-test.sh
      - test_rustfs_kms_presign.py
      - .github/workflows/kms-script-tests.yml

permissions:
  contents: read

jobs:
  kms-script-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Validate shell syntax
        run: bash -n rustfs-kms-test.sh
      - name: Test presigned KMS case without a server
        run: python3 -m unittest test_rustfs_kms_presign.py
