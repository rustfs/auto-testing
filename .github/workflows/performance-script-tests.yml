name: Performance Script Tests

on:
  pull_request:
    paths:
      - rustfs_performance_testing.sh
      - rustfs_performance_test.sh
      - scripts/performance_s3.py
      - scripts/performance_delete_probe.py
      - test_performance_s3.py
      - test_rustfs_performance_testing.py
      - .github/workflows/performance-script-tests.yml
  push:
    branches: [main]
    paths:
      - rustfs_performance_testing.sh
      - rustfs_performance_test.sh
      - scripts/performance_s3.py
      - scripts/performance_delete_probe.py
      - test_performance_s3.py
      - test_rustfs_performance_testing.py
      - .github/workflows/performance-script-tests.yml

permissions:
  contents: read

jobs:
  performance-script-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Validate shell syntax
        run: |
          bash -n rustfs_performance_testing.sh
          bash -n rustfs_performance_test.sh
      - name: Install S3 test client
        run: python3 -m pip install 'boto3>=1.35,<2'
      - name: Test benchmark result contracts without a server
        run: python3 -B -m unittest -v test_rustfs_performance_testing.py test_performance_s3.py
