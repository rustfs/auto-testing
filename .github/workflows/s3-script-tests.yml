name: S3 Script Tests

on:
  pull_request:
    paths:
      - rustfs-s3-compat-test.sh
      - test_rustfs_s3_usage.py
      - test_rustfs_s3_signing.py
      - test_validation_s3_basic.sh
      - .github/workflows/s3-script-tests.yml
  push:
    branches: [main]
    paths:
      - rustfs-s3-compat-test.sh
      - test_rustfs_s3_usage.py
      - test_rustfs_s3_signing.py
      - test_validation_s3_basic.sh
      - .github/workflows/s3-script-tests.yml

permissions:
  contents: read

jobs:
  s3-script-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Validate shell syntax
        run: bash -n rustfs-s3-compat-test.sh
      - name: Install independent SigV4 verifier
        run: python3 -m pip install botocore==1.43.19
      - name: Test S3 cases and signatures without a cluster
        run: python3 -m unittest test_rustfs_s3_usage.py test_rustfs_s3_signing.py
      - name: Test validation S3 round trip without a cluster
        run: bash test_validation_s3_basic.sh
