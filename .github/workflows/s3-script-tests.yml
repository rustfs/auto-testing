name: S3 Script Tests

on:
  pull_request:
    paths:
      - rustfs-s3-compat-test.sh
      - scripts/campaign/run-worm-object-lock.sh
      - test_rustfs_s3_usage.py
      - test_rustfs_s3_signing.py
      - test_rustfs_s3_regressions.py
      - scripts/s3_bulk_delete_regressions.py
      - scripts/s3_bulk_delete_keys.py
      - scripts/performance_s3.py
      - scripts/local_rustfs.py
      - scripts/mrf_long_root_refresh.py
      - scripts/s3_request_id_parity.py
      - scripts/s3_upload_part_timeout.py
      - scripts/s3_veeam_sosapi_capacity.py
      - test_mrf_long_root_refresh.py
      - test_s3_request_id_parity.py
      - test_s3_upload_part_timeout.py
      - test_s3_veeam_sosapi_capacity.py
      - test_s3_bulk_delete_regressions.py
      - test_s3_bulk_delete_keys.py
      - test_s3_bulk_delete_observations.py
      - scripts/sse_contract_cases.py
      - test_sse_contract_cases.py
      - test_rustfs_worm_object_lock.py
      - test_validation_s3_basic.sh
      - .github/workflows/s3-script-tests.yml
  push:
    branches: [main]
    paths:
      - rustfs-s3-compat-test.sh
      - scripts/campaign/run-worm-object-lock.sh
      - test_rustfs_s3_usage.py
      - test_rustfs_s3_signing.py
      - test_rustfs_s3_regressions.py
      - scripts/s3_bulk_delete_regressions.py
      - scripts/s3_bulk_delete_keys.py
      - scripts/performance_s3.py
      - scripts/local_rustfs.py
      - scripts/mrf_long_root_refresh.py
      - scripts/s3_request_id_parity.py
      - scripts/s3_upload_part_timeout.py
      - scripts/s3_veeam_sosapi_capacity.py
      - test_mrf_long_root_refresh.py
      - test_s3_request_id_parity.py
      - test_s3_upload_part_timeout.py
      - test_s3_veeam_sosapi_capacity.py
      - test_s3_bulk_delete_regressions.py
      - test_s3_bulk_delete_keys.py
      - test_s3_bulk_delete_observations.py
      - scripts/sse_contract_cases.py
      - test_sse_contract_cases.py
      - test_rustfs_worm_object_lock.py
      - test_validation_s3_basic.sh
      - .github/workflows/s3-script-tests.yml

permissions:
  contents: read

jobs:
  s3-script-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Validate shell syntax
        run: bash -n rustfs-s3-compat-test.sh scripts/campaign/run-worm-object-lock.sh
      - name: Install independent SigV4 verifier
        run: python3 -m pip install botocore==1.43.19 'boto3>=1.43.19,<1.43.20'
      - name: Test S3 cases and signatures without a cluster
        run: python3 -B -m unittest test_rustfs_s3_usage.py test_rustfs_s3_signing.py test_rustfs_s3_regressions.py test_rustfs_worm_object_lock.py test_s3_bulk_delete_regressions.py test_s3_bulk_delete_keys.py test_s3_bulk_delete_observations.py test_sse_contract_cases.py
      - name: Test standalone S3 probe oracles
        run: python3 -B -m unittest test_mrf_long_root_refresh.py test_s3_request_id_parity.py test_s3_upload_part_timeout.py test_s3_veeam_sosapi_capacity.py
      - name: Test validation S3 round trip without a cluster
        run: bash test_validation_s3_basic.sh
