name: Validation Catalog Tests

on:
  pull_request:
    paths:
      - validation-cases.json
      - scripts/validation_catalog.py
      - scripts/validation_report.py
      - scripts/validation_result.py
      - test_validation_migration.py
      - test_validation_ilm.py
      - scripts/validation_ilm/**
      - test_validation_pool.py
      - scripts/validation_pool/**
      - rustfs_pool_expand.sh
      - test_validation_replication.py
      - scripts/validation_replication/**
      - test_validation_heal.py
      - test_validation_heal_recovery.py
      - test_validation_heal_authorization.py
      - test_validation_heal_full_restart.py
      - test_validation_heal_mrf.py
      - scripts/validation_heal/**
      - docs/validation-heal-*.md
      - rustfs_heal_test.sh
      - test_validation_oidc.py
      - scripts/validation_oidc.py
      - scripts/validation_oidc/**
      - test_validation_webhooks.py
      - scripts/validation_webhooks.py
      - scripts/run_validation_case.sh
      - rustfs-replication-test.sh
      - rustfs-storage-test.sh
      - test_validation_scanner_usage.sh
      - .github/workflows/validation-catalog-tests.yml
  push:
    branches: [main]
    paths:
      - validation-cases.json
      - scripts/validation_catalog.py
      - scripts/validation_report.py
      - scripts/validation_result.py
      - test_validation_migration.py
      - test_validation_ilm.py
      - scripts/validation_ilm/**
      - test_validation_pool.py
      - scripts/validation_pool/**
      - rustfs_pool_expand.sh
      - test_validation_replication.py
      - scripts/validation_replication/**
      - test_validation_heal.py
      - test_validation_heal_recovery.py
      - test_validation_heal_authorization.py
      - test_validation_heal_full_restart.py
      - test_validation_heal_mrf.py
      - scripts/validation_heal/**
      - docs/validation-heal-*.md
      - rustfs_heal_test.sh
      - test_validation_oidc.py
      - scripts/validation_oidc.py
      - scripts/validation_oidc/**
      - test_validation_webhooks.py
      - scripts/validation_webhooks.py
      - scripts/run_validation_case.sh
      - rustfs-replication-test.sh
      - rustfs-storage-test.sh
      - test_validation_scanner_usage.sh
      - .github/workflows/validation-catalog-tests.yml

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - run: python3 scripts/validation_catalog.py check
      - run: python3 -B -m unittest -v test_validation_migration.py
      - run: python3 -B -m unittest -v test_validation_ilm.py
      - run: python3 -B -m unittest -v test_validation_pool.py
      - run: python3 -B -m unittest -v test_validation_replication.py
      - run: python3 -m pip install -r scripts/validation_ilm/requirements.txt
      - run: python3 -B -m unittest -v test_validation_heal.py test_validation_heal_recovery.py test_validation_heal_authorization.py test_validation_heal_full_restart.py test_validation_heal_mrf.py test_validation_oidc.py test_validation_webhooks.py
      - run: python3 -B scripts/validation_heal/matrix.py check
      - run: bash -n scripts/run_validation_case.sh scripts/validation_heal/run_case.sh scripts/validation_oidc/run_case.sh
      - run: bash -n rustfs-storage-test.sh rustfs_pool_expand.sh rustfs-replication-test.sh scripts/validation_pool/run_case.sh scripts/validation_replication/run_case.sh test_validation_scanner_usage.sh
      - run: bash test_validation_scanner_usage.sh
