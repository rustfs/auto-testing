      - rustfs-storage-test.sh
      - test_validation_scanner_usage.sh
      - .github/workflows/validation-catalog-tests.yml

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - run: python3 scripts/validation_catalog.py check
      - run: python3 -B -m unittest -v test_validation_migration.py
      - run: python3 -B -m unittest -v test_validation_ilm.py
      - run: python3 -B -m unittest -v test_validation_pool.py
      - run: python3 -B -m unittest -v test_validation_replication.py
      - run: python3 -m pip install -r scripts/validation_ilm/requirements.txt
      - name: Install network namespace test dependency
        run: |
          if ! command -v nft >/dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y nftables
          fi
      - run: python3 -B -m unittest -v test_validation_heal.py test_validation_heal_recovery.py test_validation_heal_authorization.py test_validation_heal_full_restart.py test_validation_heal_mrf.py test_validation_heal_unformatted.py test_validation_heal_performance.py test_validation_heal_scopes.py test_validation_heal_multi_pool.py test_validation_heal_bucket_metadata.py test_validation_heal_native.py test_validation_heal_manager_native.py test_validation_heal_manager_fixture.py test_validation_heal_journal_fault.py test_validation_heal_checkpoint.py test_validation_heal_authority.py test_validation_heal_orphan.py test_validation_heal_options.py test_validation_heal_environment.py test_validation_heal_environment_gate.py test_validation_heal_queue_pressure.py test_validation_heal_nolock.py test_validation_heal_race.py test_validation_heal_write_quorum.py test_validation_heal_schema.py test_validation_heal_encrypted.py test_validation_heal_coordinator_crash.py test_validation_heal_flapping.py test_validation_heal_capacity.py test_validation_heal_network.py test_validation_oidc.py test_validation_webhooks.py
      - run: python3 -B scripts/validation_heal/matrix.py check
      - run: python3 -B -m unittest -v test_validation_heal_outcome.py test_validation_heal_outcome_grace.py
      - run: python3 -B -m unittest -v test_validation_heal_persistence.py test_validation_heal_persistence_mrf.py
      - run: python3 -B -m unittest -v test_validation_heal_incarnation.py test_validation_heal_incarnation_replay.py
      - run: python3 -B -m unittest -v test_validation_heal_incarnation_native.py
      - run: bash -n scripts/run_validation_case.sh scripts/validation_heal/run_case.sh scripts/validation_oidc/run_case.sh
      - run: bash -n rustfs-storage-test.sh rustfs_pool_expand.sh rustfs-replication-test.sh scripts/validation_pool/run_case.sh scripts/validation_replication/run_case.sh test_validation_scanner_usage.sh
      - run: bash test_validation_scanner_usage.sh
